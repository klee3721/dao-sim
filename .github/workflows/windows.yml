name: Windows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated Windows icon
        shell: pwsh
        run: |
          node scripts/generate-windows-icon.cjs
          if (-not (Test-Path -LiteralPath 'assets/icon.ico' -PathType Leaf)) {
            throw 'assets/icon.ico was not generated.'
          }
          git diff --exit-code -- assets/icon.ico

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build Windows installer and ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:win

      - name: Verify Windows artifacts
        run: npm run package:win:verify

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dao-sim-windows-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/Đào Sim-Setup-*-x64.exe
            release/Đào Sim-*-x64.zip
            release/SHA256SUMS-windows.txt
